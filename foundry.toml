[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[profile.default.fuzz]
runs = 1000
max_test_rejects = 65536
seed = "0xdeadbeef"

[profile.default.invariant]
runs = 500
depth = 100
fail_on_revert = false
